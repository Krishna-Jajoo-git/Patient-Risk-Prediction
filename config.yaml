dataset:
  name: "demo_longitudinal (SYNTHETIC)"
  path: "data/raw/demo_longitudinal.csv"
  mode: "longitudinal"            # longitudinal | single_record
  patient_id_col: "patient_id"    # longitudinal only
  date_col: "date"                # longitudinal only
  target_col: "outcome"
  task: "binary"                  # binary | multiclass
  positive_label: 1               # binary only
  static_numeric: ["age"]                        # taken as-is (latest value)
  static_categorical: ["gender"]
  time_varying_numeric: ["bmi", "systolic_bp", "glucose", "cholesterol", "medication_count"]
  valid_ranges:                   # values outside become NaN (impossible-value handling)
    age: [0, 120]
    bmi: [10, 70]
    systolic_bp: [60, 260]
    glucose: [30, 600]
    cholesterol: [50, 500]
    medication_count: [0, 30]

split:
  test_size: 0.2
  random_state: 42
  stratify: true
  group_by_patient: true          # forced true in longitudinal mode

preprocessing:
  numeric_imputer: "median"
  categorical_imputer: "most_frequent"
  scaler: "standard"
  outlier_strategy: "valid_ranges_then_iqr_report"
  use_smote: false                # SMOTE disabled - 65/35 imbalance is mild; class_weight handles it

training:
  cv_folds: 5
  primary_metric: "f1"            # f1 | f1_macro | roc_auc | recall
  param_grids:
    knn:
      clf__n_neighbors: [3, 5, 7, 11, 15, 21]
      clf__weights: ["uniform", "distance"]
      clf__metric: ["euclidean", "manhattan"]
    decision_tree:
      clf__max_depth: [3, 5, 8, 12, null]
      clf__min_samples_leaf: [1, 5, 10, 20]
      clf__min_samples_split: [2, 10]
      clf__class_weight: [null, "balanced"]
      clf__criterion: ["gini", "entropy"]
    logistic_regression:
      clf__C: [0.001, 0.01, 0.1, 1, 10, 100]
      clf__class_weight: [null, "balanced"]
      clf__penalty: ["l2", "l1"]
      clf__solver: ["lbfgs", "liblinear"]
    random_forest:
      clf__n_estimators: [100, 200, 300]
      clf__max_depth: [null, 8, 12, 16]
      clf__min_samples_leaf: [1, 3, 5]
      clf__class_weight: [null, "balanced", "balanced_subsample"]
      clf__max_features: ["sqrt", "log2"]

paths:
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
