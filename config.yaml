dataset:
  name: "Cardiovascular Disease Cohort (cardio_train)"
  path: "data/raw/cardio_train.csv"
  delimiter: ";"
  mode: "single_record"            # single_record | longitudinal
  target_col: "cardio"
  task: "binary"                  # binary | multiclass
  positive_label: 1               # 1 = presence of cardiovascular disease
  id_col: "id"
  raw_features:
    - "age"
    - "gender"
    - "height"
    - "weight"
    - "ap_hi"
    - "ap_lo"
    - "cholesterol"
    - "gluc"
    - "smoke"
    - "alco"
    - "active"
  static_numeric:
    - "age_years"
    - "height"
    - "weight"
    - "ap_hi"
    - "ap_lo"
    - "bmi"
    - "pulse_pressure"
    - "map"
    - "age_x_bp"
    - "composite_risk_score"
  static_categorical:
    - "gender"
    - "cholesterol"
    - "gluc"
    - "smoke"
    - "alco"
    - "active"
    - "bp_category"
    - "bmi_category"
  time_varying_numeric: []
  valid_ranges:                   # values outside become NaN (handled via median imputer)
    age: [10000, 26000]
    height: [120, 220]
    weight: [35, 200]
    ap_hi: [70, 240]
    ap_lo: [40, 160]

split:
  test_size: 0.2
  random_state: 42
  stratify: true

preprocessing:
  numeric_imputer: "median"
  categorical_imputer: "most_frequent"
  scaler: "standard"
  outlier_strategy: "valid_ranges_then_median_impute"
  use_smote: false                # Balanced classes (~50/50), SMOTE not needed

training:
  cv_folds: 5
  primary_metric: "f1"            # f1 | roc_auc | accuracy
  param_grids:
    logistic_regression:
      clf__C: [0.01, 0.1, 1.0, 10.0]
      clf__penalty: ["l2"]
      clf__solver: ["lbfgs"]
    decision_tree:
      clf__max_depth: [4, 6, 8, 10, null]
      clf__min_samples_leaf: [2, 5, 10, 20]
      clf__criterion: ["gini", "entropy"]
    random_forest:
      clf__n_estimators: [100, 200]
      clf__max_depth: [8, 12, 16, null]
      clf__min_samples_leaf: [2, 5, 10]
      clf__max_features: ["sqrt", "log2"]
    knn:
      clf__n_neighbors: [7, 11, 15, 21]
      clf__weights: ["uniform", "distance"]
      clf__metric: ["euclidean", "manhattan"]

paths:
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
